services:
  fhirserver:
    image: ghcr.io/healthintersections/fhirsmith:latest
    #image: ghcr.io/healthintersections/fhirsmith:cibuild
    #image: ghcr.io/healthintersections/fhirsmith:v0.10.1
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    container_name: tx2-fhir
    ports:
      - "3000:3000" # Map port 3000 from the host to port 3000 in the container
